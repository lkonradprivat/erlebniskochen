": "TR", "optional": false}]}, {"category": "Suppe", "name": "Süßkartoffel-Linsen-Kokosnuss-Suppe", "ingredients": [{"text": "30 g Olivenöl", "owner": "GG", "optional": false}, {"text": "1 TL Salz", "owner": "GG", "optional": false}, {"text": "70 g rote Linsen, getrocknet", "owner": "GG", "optional": false}, {"text": "1 Dose Kokosmilch (400 g)", "owner": "GG", "optional": false}, {"text": "10 g Kokosflocken", "owner": "GG", "optional": false}, {"text": "1 Knoblauchzehe", "owner": "TR", "optional": false}, {"text": "400 g Süßkartoffeln, in Stücken (3 cm)", "owner": "TR", "optional": false}, {"text": "1 TL Kreuzkümmel (Cumin), gemahlen", "owner": "TR", "optional": false}, {"text": "1 rote Chilischote, frisch, entkernt, gehackt, und etwas mehr zum Servieren, in Scheiben", "owner": "TR", "optional": false}, {"text": "1 Bund Koriander, abgezupft", "owner": "TR", "optional": false}, {"text": "2 geh. TL Gewürzpaste für Gemüsebrühe, selbst gemacht oder 2 Würfel Gemüsebrühe (für je 0,5 l)", "owner": "TR", "optional": false}, {"text": "20 g Limettensaft", "owner": "TR", "optional": false}, {"text": "1 Limette, geviertelt, zum Garnieren", "owner": "TR", "optional": false}]}];const CATS=['Eis','Brot','Dip','Salat','Hauptgericht'];const WINTER=['Gewürze & Zucker','Dessert','Suppe'];const WINTER_START=15;const KEY='erlebniskochen-testversion-winter-2026';const $=id=>document.getElementById(id);let selected={},optional={},topping=false;function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function slots(){return $('mode').value==='5'?CATS:($('mode').value==='winter'?WINTER:['Rezept 1','Rezept 2','Rezept 3'])}function optionsFor(slot){let mode=$('mode').value;return RECIPES.map((r,i)=>({r,i})).filter(x=>mode==='5'?x.i<WINTER_START&&x.r.category===slot:mode==='winter'?x.i>=WINTER_START&&x.r.category===slot:true)}function render(){let ss=slots();$('winter-extra').hidden=$('mode').value!=='winter';$('topping').checked=topping;$('picks').innerHTML=ss.map((slot,k)=>{let ix=selected[k];if(ix==null||!optionsFor(slot).some(x=>x.i===ix)){ix=null;delete selected[k]}let r=ix===null?null:RECIPES[ix];let opts=(r?r.ingredients:[]).map((x,j)=>x.optional?`<label class="opt"><input type="checkbox" data-slot="${k}" data-ing="${j}" ${optional[k+':'+j]?'checked':''}><span>${esc(x.text)} <small>(${x.owner})</small></span></label>`:'').filter(Boolean).join('');return `<div class="card"><label><b>${esc(slot)}</b><select data-select="${k}"><option value="" ${ix===null?'selected':''}>Bitte auswählen …</option>${optionsFor(slot).map(x=>`<option value="${x.i}" ${x.i===ix?'selected':''}>${esc(x.r.name)}</option>`).join('')}</select></label><div class="muted">Feste Zutaten werden automatisch übernommen.</div>${opts?'<p><b>Optionale Zutaten – nur mit Häkchen:</b></p>'+opts:'<p class="muted">Keine optionalen Zutaten.</p>'}</div>`}).join('');document.querySelectorAll('[data-select]').forEach(el=>el.addEventListener('change',()=>{let k=+el.dataset.select;if(el.value==='')delete selected[k];else selected[k]=+el.value;Object.keys(optional).filter(x=>x.startsWith(k+':')).forEach(x=>delete optional[x]);render()}));document.querySelectorAll('[data-ing]').forEach(el=>el.addEventListener('change',()=>{optional[el.dataset.slot+':'+el.dataset.ing]=el.checked;renderLists()}));renderLists()}function renderLists(){let lists={GG:[],TR:[]};slots().forEach((slot,k)=>{let ix=selected[k];let r=ix==null?null:RECIPES[ix];if(!r)return;r.ingredients.forEach((x,j)=>{if(!x.optional||optional[k+':'+j])lists[x.owner].push(x.text)})});if($('mode').value==='winter'&&topping){lists.TR.push('200 g Äpfel mit festem Fruchtfleisch, z. B. Pink Lady');lists.GG.push('15 g Zucker','½ TL Zimt, gemahlen','10 g Butterschmalz')}let missing=slots().filter((slot,k)=>selected[k]==null||!optionsFor(slot).some(x=>x.i===selected[k]));let complete=missing.length===0;let host=$('host').value.trim(),date=$('date').value;let title=`${$('mode').value==='5'?'Klassisches Erlebniskochen':($('mode').value==='winter'?'Aktionswoche Winter Date':'Aktionswoche')}${host?' bei '+host:''}${date?' am '+date.split('-').reverse().join('.'):''}`;let format=(owner,heading)=>`<section><h2>${heading}</h2><ul>${lists[owner].map(s=>'<li>'+esc(s)+'</li>').join('')}</ul></section>`;$('print').disabled=!complete;$('save').disabled=!complete;$('result').innerHTML=`${complete?'':`<p role="status" style="color:#8b4513;font-weight:600">Bitte wähle zuerst alle ${slots().length} Rezepte aus. Noch ${missing.length} ${missing.length===1?'Rezept':'Rezepte'} offen.</p>`}<p><b>${esc(title)}</b></p><p class="muted">Gleiche Zutaten aus verschiedenen Rezepten werden hier einzeln aufgeführt; Mengen werden nicht automatisch addiert.</p>`+format('GG','GG – Deine Liste (Gastgeberin)')+format('TR','TR – Meine Liste (Repräsentantin)')+'<p class="muted">„Oder“-Angaben und Mengenbereiche entsprechen der Vorlage; die konkrete Alternative wird beim Einkauf gewählt.</p>'} $('mode').addEventListener('change',()=>{selected={};optional={};topping=false;render()});$('topping').addEventListener('change',e=>{topping=e.target.checked;renderLists()});['host','date'].forEach(id=>$(id).addEventListener('input',renderLists));$('print').onclick=()=>{if($('print').disabled)return;window.print()};$('save').onclick=()=>{if($('save').disabled)return;localStorage.setItem(KEY,JSON.stringify({mode:$('mode').value,host:$('host').value,date:$('date').value,selected,optional,topping}));$('notice').textContent='Testplan auf diesem Gerät gespeichert.'};$('load').onclick=()=>{try{let d=JSON.parse(localStorage.getItem(KEY));if(!d)throw Error();$('mode').value=d.mode;$('host').value=d.host||'';$('date').value=d.date||'';selected=d.selected||{};optional=d.optional||{};topping=!!d.topping;render();$('notice').textContent='Gespeicherter Testplan geladen.'}catch(e){$('notice').textContent='Noch kein gespeicherter Testplan vorhanden.'}};$('clear').onclick=()=>{$('mode').value='5';$('host').value='';$('date').value='';selected={};optional={};topping=false;render();$('notice').textContent='Neue Planung begonnen. Gespeicherter Testplan bleibt erhalten.'};render();</script></body></html>
