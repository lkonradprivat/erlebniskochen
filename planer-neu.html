slot).some(x=>x.i===ix)){ix=optionsFor(slot)[0].i;selected[k]=ix}let r=RECIPES[ix];let opts=r.ingredients.map((x,j)=>x.optional?`<label class="opt"><input type="checkbox" data-slot="${k}" data-ing="${j}" ${optional[k+':'+j]?'checked':''}><span>${esc(x.text)} <small>(${x.owner})</small></span></label>`:'').filter(Boolean).join('');return `<div class="card"><label><b>${esc(slot)}</b><select data-select="${k}">${optionsFor(slot).map(x=>`<option value="${x.i}" ${x.i===ix?'selected':''}>${esc(x.r.name)}</option>`).join('')}</select></label><div class="muted">Feste Zutaten werden automatisch übernommen.</div>${opts?'<p><b>Optionale Zutaten – nur mit Häkchen:</b></p>'+opts:'<p class="muted">Keine optionalen Zutaten.</p>'}</div>`}).join('');document.querySelectorAll('[data-select]').forEach(el=>el.addEventListener('change',()=>{let k=+el.dataset.select;selected[k]=+el.value;Object.keys(optional).filter(x=>x.startsWith(k+':')).forEach(x=>delete optional[x]);render()}));document.querySelectorAll('[data-ing]').forEach(el=>el.addEventListener('change',()=>{optional[el.dataset.slot+':'+el.dataset.ing]=el.checked;renderLists()}));renderLists()}function renderLists(){let lists={GG:[],TR:[]};slots().forEach((slot,k)=>{let r=RECIPES[selected[k]];if(!r)return;r.ingredients.forEach((x,j)=>{if(!x.optional||optional[k+':'+j])lists[x.owner].push(x.text)})});let host=$('host').value.trim(),date=$('date').value;let title=`${$('mode').value==='5'?'Klassisches Erlebniskochen':'Aktionswoche'}${host?' bei '+host:''}${date?' am '+date.split('-').reverse().join('.'):''}`;let format=(owner,heading)=>`<section><h2>${heading}</h2><ul>${lists[owner].map(s=>'<li>'+esc(s)+'</li>').join('')}</ul></section>`;$('result').innerHTML=`<p><b>${esc(title)}</b></p><p class="muted">Gleiche Zutaten aus verschiedenen Rezepten werden hier einzeln aufgeführt; Mengen werden nicht automatisch addiert.</p>`+format('GG','GG – Deine Liste (Gastgeberin)')+format('TR','TR – Meine Liste (Repräsentantin)')+'<p class="muted"
